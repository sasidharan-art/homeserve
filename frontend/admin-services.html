<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Services | HomeServe</title><link rel="stylesheet" href="css/style.css"></head><body class="shell">
<header class="topbar"><div class="topbar-inner"><a class="brand" href="admin.html"><span class="brand-mark">H</span><span>Service Manager</span></a><div class="header-actions"><a class="btn btn-secondary" href="admin.html">Dashboard</a><button class="btn btn-danger" id="logoutBtn">Logout</button></div></div></header>
<main class="main"><section class="page-hero"><span class="eyebrow">Admin tools</span><h1>Manage service catalogue</h1><p>Add new services or update the information, category and price displayed to customers.</p></section><div class="grid" style="grid-template-columns:minmax(300px,.75fr) minmax(420px,1.25fr);align-items:start"><section class="panel"><h2 id="formTitle" style="font-family:Manrope,sans-serif;margin-bottom:22px">Add New Service</h2><form id="serviceForm"><input id="serviceId" type="hidden"><div class="form-group"><label for="name">Service name</label><input id="name" required></div><div class="form-group"><label for="description">Description</label><textarea id="description" rows="4" required></textarea></div><div class="form-row"><div class="form-group"><label for="category">Category</label><input id="category" required></div><div class="form-group"><label for="price">Price (₹)</label><input id="price" type="number" min="0" step="0.01" required></div></div><button id="saveBtn" type="submit">Add Service</button><button id="cancelEditBtn" type="button" class="btn btn-secondary" hidden style="width:100%;margin-top:10px">Cancel edit</button></form></section><section><div id="serviceMessage" class="page-message"></div><div id="serviceList"></div></section></div></main><footer class="footer">© 2026 HomeServe Administration</footer><script src="js/runtime-v80.js?v=8000"></script><script src="js/admin-services.js"></script><script src="js/ui-effects.js"></script></body></html>
